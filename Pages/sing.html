<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="/Pages/sing.css">
</head>

<body>
    
    <div class="container">
        <h1>Cadastro</h1>
        <form class="input-form">
            <div class="email">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="Digite seu E-mail">
            </div>
            <div class="usuario">
                <label for="usuario">Úsuario:</label>
                <input type="text" id="usuario" required placeholder="Insira seu usuario">
            </div>
            <div class="senha">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>
            <p>Digite novamente sua senha</p>

            <div class="senha">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </div>

            <div>
                <button type="submit" id="btn-sigg">Confirmar</button>
            </div>

        </form>
    </div>
</body>

</html>
