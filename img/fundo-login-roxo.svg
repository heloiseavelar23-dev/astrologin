<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0d5c"/>
      <stop offset="45%" stop-color="#6b1f8f"/>
      <stop offset="75%" stop-color="#9b4fc4"/>
      <stop offset="100%" stop-color="#c9a6e0"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6fae" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6fae" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet1" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#c98bd9"/>
      <stop offset="100%" stop-color="#5c1e82"/>
    </radialGradient>
    <radialGradient id="planet2" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e6b8f0"/>
      <stop offset="100%" stop-color="#8a3fae"/>
    </radialGradient>
    <linearGradient id="cardShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="1920" height="1080" fill="url(#bgMain)"/>

  <!-- brilho difuso -->
  <circle cx="1500" cy="250" r="500" fill="url(#glowPink)"/>
  <circle cx="250" cy="850" r="450" fill="url(#glowPink)" opacity="0.5"/>

  <!-- estrelas -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="2.5" opacity="0.9"/>
    <circle cx="300" cy="180" r="1.6" opacity="0.7"/>
    <circle cx="470" cy="60" r="2" opacity="0.8"/>
    <circle cx="640" cy="220" r="1.4" opacity="0.6"/>
    <circle cx="90" cy="400" r="2" opacity="0.7"/>
    <circle cx="260" cy="520" r="1.6" opacity="0.6"/>
    <circle cx="1720" cy="120" r="2.2" opacity="0.85"/>
    <circle cx="1600" cy="320" r="1.5" opacity="0.6"/>
    <circle cx="1820" cy="480" r="2" opacity="0.75"/>
    <circle cx="1400" cy="90" r="1.6" opacity="0.7"/>
    <circle cx="1850" cy="700" r="2.4" opacity="0.8"/>
    <circle cx="1050" cy="60" r="1.5" opacity="0.6"/>
    <circle cx="150" cy="700" r="1.8" opacity="0.65"/>
    <circle cx="60" cy="950" r="2.2" opacity="0.8"/>
    <circle cx="380" cy="950" r="1.4" opacity="0.55"/>
    <circle cx="1700" cy="900" r="1.8" opacity="0.7"/>
    <circle cx="1500" cy="980" r="1.4" opacity="0.55"/>
  </g>

  <!-- planetas decorativos -->
  <circle cx="150" cy="150" r="70" fill="url(#planet1)" opacity="0.5"/>
  <circle cx="1780" cy="220" r="45" fill="url(#planet2)" opacity="0.55"/>
  <circle cx="1830" cy="850" r="90" fill="url(#planet1)" opacity="0.45"/>
  <circle cx="120" cy="920" r="55" fill="url(#planet2)" opacity="0.5"/>

  <!-- nuvens/ondas suaves ao fundo, tipo cauda de foguete -->
  <path d="M -100 900 C 300 750, 500 1050, 900 880 C 1300 720, 1500 1050, 2020 850 L 2020 1080 L -100 1080 Z"
        fill="#ffffff" opacity="0.06"/>
  <path d="M -100 950 C 350 830, 600 1080, 1000 930 C 1350 800, 1600 1080, 2020 900 L 2020 1080 L -100 1080 Z"
        fill="#ffffff" opacity="0.05"/>

  <!-- foguete estilizado (formas originais, não copiado da referência) -->
  <g transform="translate(430 640) rotate(-38)">
    <!-- rastro -->
    <path d="M -30 40 C -160 90, -220 170, -260 260 C -180 220, -100 210, -30 230 Z" fill="#ffffff" opacity="0.85"/>
    <path d="M -20 30 C -120 65, -170 130, -200 200 C -130 175, -70 170, -20 185 Z" fill="#f2d9ff" opacity="0.9"/>
    <!-- chama -->
    <ellipse cx="0" cy="55" rx="16" ry="34" fill="#ff8fc2"/>
    <ellipse cx="0" cy="55" rx="9" ry="22" fill="#ffd76a"/>
    <!-- corpo -->
    <path d="M 0 -120 C 26 -90, 30 -20, 22 40 L -22 40 C -30 -20, -26 -90, 0 -120 Z" fill="#f5eaff"/>
    <path d="M 0 -120 C 26 -90, 30 -20, 22 40 L 0 40 Z" fill="#dcc2f5"/>
    <!-- ponta -->
    <path d="M 0 -120 C 8 -140, -8 -140, 0 -120 Z" fill="#ff6fae"/>
    <!-- janela -->
    <circle cx="0" cy="-45" r="15" fill="#6b1f8f"/>
    <circle cx="0" cy="-45" r="10" fill="#b98bdc"/>
    <!-- aletas -->
    <path d="M -22 20 L -55 55 L -18 42 Z" fill="#ff6fae"/>
    <path d="M 22 20 L 55 55 L 18 42 Z" fill="#ff6fae"/>
  </g>

  <!-- vinheta suave nas bordas -->
  <rect width="1920" height="1080" fill="url(#cardShadow)"/>
</svg>
